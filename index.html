<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>年齢確認｜18歳以上ですか?</title>
<script src="config.js"></script>
<style>
  :root {
    --bg: #1f4fd1;
    --ink: #ffffff;
    --accent: #1f4fd1;
    --hover: #e3ebff;
    --mute: #cfdbff;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* 移動先の確認が終わるまでは真っ白にしておく */
  html { background: #ffffff; }
  html:not(.ready) body { visibility: hidden; }
  html.ready { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }
  .gate {
    position: relative;
    min-height: 100%;
    display: grid;
    align-content: center;
    padding: 48px 24px;
  }
  .panel {
    position: relative;
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
  }

  /* 誤タップ防止スライダー */
  .lock { margin: 0 0 36px; }
  .track {
    position: relative;
    height: 64px;
    padding-left: 56px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    cursor: grab;
  }
  .track.open { background: rgba(255, 255, 255, 0.24); }
  .hint {
    padding: 0 12px;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
    pointer-events: none;
  }
  .thumb {
    position: absolute;
    left: 4px;
    top: 4px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #fff;
    color: var(--accent);
    display: grid;
    place-items: center;
    font-size: 1.7rem;
    font-weight: 900;
    line-height: 1;
    pointer-events: none;
    transition: transform 0.2s ease;
  }
  .thumb.active { transition: none; }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    font-weight: 800;
    line-height: 1.35;
  }
  .lead { margin: 0 0 28px; font-size: 1.05rem; }
  .actions { display: grid; gap: 12px; }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 16px 20px;
    border-radius: 10px;
    border: 2px solid var(--ink);
    cursor: pointer;
    text-align: center;
  }
  .yes { background: #fff; border-color: #fff; color: var(--accent); }
  .yes:hover:not(:disabled) { background: var(--hover); border-color: var(--hover); }
  .no { background: transparent; color: var(--ink); }
  .no:hover { background: rgba(255, 255, 255, 0.14); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .meta { margin: 24px 0 0; font-size: 0.85rem; color: var(--mute); }
  .meta strong { color: var(--ink); word-break: break-all; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .thumb { transition: none; }
  }
</style>
</head>
<body>
<main class="gate">
  <div class="panel">
    <div class="lock">
      <div class="track" id="track">
        <span class="hint" id="hint">右にスライドして押さえたままにする</span>
        <div class="thumb" id="thumb" aria-hidden="true">›</div>
      </div>
    </div>

    <h1>ここから先は成人向けサイトです</h1>
    <p class="lead">18歳以上の方のみ閲覧できます。あなたは18歳以上ですか?</p>

    <div class="actions">
      <button type="button" class="yes" id="yes" disabled>はい、18歳以上です</button>
      <button type="button" class="no" id="no">いいえ、戻ります</button>
    </div>

    <p class="meta" id="meta" hidden>移動先: <strong id="host"></strong></p>
  </div>
</main>

<script>
(function () {
  // 設定は config.js にあります(無い項目は下の初期値を使います)
  var C = window.CONFIG || {};
  var EXIT_URL = C.exitUrl || "https://www.google.com/";
  var NO_DEST_URL = C.noDestUrl || "https://l.tnct.f5.si/";
  var ALLOWED_HOSTS = C.allowedHosts || [];
  var HOLD_ON_MOUSE = !!C.holdOnMouse;

  var HINT_LOCKED = "右にスライドして押さえたままにする";
  var HINT_OPEN = "解除中。押さえたまま「はい」を押す";
  var HINT_DONE = "ロック解除済み";

  function getDestination() {
    var raw = location.hash.slice(1);
    if (!raw) return null;
    try { raw = decodeURIComponent(raw); } catch (e) {}
    // スキームが無ければ https:// を補う
    if (!/^[a-z][a-z0-9+.\-]*:/i.test(raw)) raw = "https://" + raw;
    try {
      var u = new URL(raw);
      if (u.protocol !== "https:" && u.protocol !== "http:") return null;
      if (ALLOWED_HOSTS.length && ALLOWED_HOSTS.indexOf(u.hostname) === -1) return null;
      return u;
    } catch (e) {
      return null;
    }
  }

  var dest = getDestination();
  if (!dest) {
    location.replace(NO_DEST_URL);
    return;
  }

  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var track = document.getElementById("track");
  var thumb = document.getElementById("thumb");
  var hint = document.getElementById("hint");

  document.getElementById("host").textContent = dest.hostname;
  document.getElementById("meta").hidden = false;
  document.documentElement.className = "ready";

  var dragging = false, stuck = false, unlocked = false;
  var pid = null, startX = 0, maxX = 0;

  function setUnlocked(v) {
    unlocked = v;
    yes.disabled = !v;
    track.classList.toggle("open", v);
    hint.textContent = v ? (stuck ? HINT_DONE : HINT_OPEN) : HINT_LOCKED;
  }

  function start(id, x) {
    if (stuck || dragging) return;
    dragging = true;
    pid = id;
    startX = x;
    maxX = track.clientWidth - thumb.offsetWidth - 8;
    thumb.classList.add("active");
  }

  function move(id, x) {
    if (!dragging || id !== pid) return;
    var dx = Math.max(0, Math.min(maxX, x - startX));
    thumb.style.transform = "translateX(" + dx + "px)";
    var atEnd = dx >= maxX - 2;
    if (atEnd !== unlocked) setUnlocked(atEnd);
  }

  // kind: "touch" | "mouse" | "cancel"
  function finish(id, kind) {
    if (!dragging || id !== pid) return;
    dragging = false;
    thumb.classList.remove("active");
    // マウスは右端まで動かしたら解除したままにする
    if (unlocked && kind === "mouse" && !HOLD_ON_MOUSE) {
      stuck = true;
      setUnlocked(true);
      return;
    }
    thumb.style.transform = "";
    setUnlocked(false);
  }

  function findTouch(list) {
    for (var k = 0; k < list.length; k++) {
      if (list[k].identifier === pid) return list[k];
    }
    return null;
  }

  if (window.PointerEvent) {
    track.addEventListener("pointerdown", function (e) {
      start(e.pointerId, e.clientX);
      try { track.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    track.addEventListener("pointermove", function (e) { move(e.pointerId, e.clientX); });
    track.addEventListener("pointerup", function (e) {
      finish(e.pointerId, e.pointerType === "touch" ? "touch" : "mouse");
    });
    track.addEventListener("pointercancel", function (e) { finish(e.pointerId, "cancel"); });
  } else {
    // 古いブラウザ向け(タッチイベント)
    track.addEventListener("touchstart", function (e) {
      var t = e.changedTouches[0];
      start(t.identifier, t.clientX);
      e.preventDefault();
    }, { passive: false });
    track.addEventListener("touchmove", function (e) {
      var t = findTouch(e.changedTouches);
      if (t) move(t.identifier, t.clientX);
      e.preventDefault();
    }, { passive: false });
    track.addEventListener("touchend", function (e) {
      var t = findTouch(e.changedTouches);
      if (t) finish(t.identifier, "touch");
    });
    track.addEventListener("touchcancel", function (e) {
      var t = findTouch(e.changedTouches);
      if (t) finish(t.identifier, "cancel");
    });
  }
  track.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  var going = false;
  function go() {
    if (!unlocked || going) return;
    going = true;
    location.href = dest.href;
  }
  // スライダーを押さえている間の2本目の指では、端末によって click が発生しないため、
  // 指が触れた瞬間(pointerdown / touchstart)でも移動する
  if (window.PointerEvent) yes.addEventListener("pointerdown", go);
  else yes.addEventListener("touchstart", go);
  yes.addEventListener("click", go);
  // 戻るボタンで戻ってきたときは、ロックし直す
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    going = false;
    stuck = false;
    dragging = false;
    thumb.classList.remove("active");
    thumb.style.transform = "";
    setUnlocked(false);
  });
  no.addEventListener("click", function () {
    location.href = EXIT_URL;
  });
})();
</script>
</body>
</html>
